name: Build and Test

on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Test and build JARs
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Check executable and sources JARs
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(mvn --batch-mode --no-transfer-progress --quiet org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)"
          python3 scripts/smoke-release.py "target/cityinfojp-${PROJECT_VERSION}.jar" "target/cityinfojp-${PROJECT_VERSION}-sources.jar"
